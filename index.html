<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4fa">
  <title>Quiz de conhecimentos</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #27263a;
      background: #f4f4fa;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 28px 16px;
      background: radial-gradient(ellipse at 50% 0%, #e5e2ff 0, transparent 36rem), #f4f4fa;
    }
    main { width: min(100%, 640px); }
    .brand { margin: 0 0 18px; color: #665ad1; font-size: .76rem; font-weight: 800; letter-spacing: .16em; text-align: center; text-transform: uppercase; }
    .card {
      padding: clamp(22px, 6vw, 42px);
      border: 1px solid #e7e6f0;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 24px 70px #28245a0e;
    }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #85839a; font-size: .85rem; }
    .progress { height: 7px; margin: 14px 0 30px; overflow: hidden; border-radius: 99px; background: #eeedf5; }
    .progress-bar { width: 0; height: 100%; border-radius: inherit; background: #7466df; transition: width .25s ease; }
    h1 { margin: 0 0 24px; font-size: clamp(1.45rem, 5vw, 2rem); letter-spacing: -.035em; line-height: 1.3; }
    .answers { display: grid; gap: 10px; }
    .answer {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #e6e5ee;
      border-radius: 12px;
      background: #fff;
      color: #46445a;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .15s;
    }
    .answer:hover:not(:disabled) { transform: translateY(-1px); border-color: #aaa3ec; background: #faf9ff; }
    .answer:focus-visible, .next-button:focus-visible { outline: 3px solid #cbc6fb; outline-offset: 2px; }
    .answer:disabled { cursor: default; }
    .letter {
      display: grid;
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      place-items: center;
      border-radius: 9px;
      background: #f1f0f7;
      color: #737187;
      font-size: .83rem;
      font-weight: 800;
    }
    .answer.correct { border-color: #91c8a4; background: #f0faf3; color: #2c6740; }
    .answer.correct .letter { background: #d9f0e0; color: #2c6740; }
    .answer.incorrect { border-color: #e5a5a1; background: #fff5f4; color: #91433e; }
    .answer.incorrect .letter { background: #f9e1df; color: #91433e; }
    .feedback { min-height: 24px; margin: 14px 0 0; color: #6e6c82; font-size: .9rem; }
    .bottom { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 22px; }
    .score { color: #85839a; font-size: .88rem; }
    .next-button {
      padding: 12px 18px;
      border: 0;
      border-radius: 11px;
      background: #6558cb;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .next-button:hover { background: #5145b2; }
    .next-button:disabled { background: #d8d6e5; cursor: not-allowed; }
    .final { text-align: center; }
    .trophy { margin: 4px 0 16px; font-size: 3rem; }
    .final h1 { margin-bottom: 10px; }
    .final p { color: #77758a; line-height: 1.6; }
    .final strong { color: #6558cb; font-size: 1.25rem; }
    .final .next-button { margin-top: 12px; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">Desafio rápido</p>
    <section id="quiz" class="card" aria-live="polite">
      <div class="topline">
        <span id="question-count">Pergunta 1 de 5</span>
        <span id="current-score">0 pontos</span>
      </div>
      <div class="progress" role="progressbar" aria-label="Progresso do quiz" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <h1 id="question"></h1>
      <div id="answers" class="answers"></div>
      <p id="feedback" class="feedback" aria-live="assertive"></p>
      <div class="bottom">
        <span class="score">Cada acerto vale 1 ponto</span>
        <button id="next-button" class="next-button" type="button" disabled>Próxima</button>
      </div>
    </section>

    <section id="final" class="card final" hidden>
      <div class="trophy" aria-hidden="true">🏆</div>
      <h1>Quiz concluído!</h1>
      <p id="final-score"></p>
      <button id="restart-button" class="next-button" type="button">Jogar novamente</button>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "Qual é o maior planeta do Sistema Solar?",
        answers: ["Terra", "Júpiter", "Saturno", "Netuno"],
        correct: 1
      },
      {
        question: "Qual linguagem estrutura o conteúdo de uma página web?",
        answers: ["CSS", "JavaScript", "HTML", "SQL"],
        correct: 2
      },
      {
        question: "Quantos lados tem um hexágono?",
        answers: ["Cinco", "Seis", "Sete", "Oito"],
        correct: 1
      },
      {
        question: "Qual destes animais é um mamífero que põe ovos?",
        answers: ["Pinguim", "Morcego", "Ornitorrinco", "Golfinho"],
        correct: 2
      },
      {
        question: "Qual é o resultado de 9 × 7?",
        answers: ["56", "63", "72", "81"],
        correct: 1
      }
    ];

    const quiz = document.querySelector("#quiz");
    const finalScreen = document.querySelector("#final");
    const questionCount = document.querySelector("#question-count");
    const currentScore = document.querySelector("#current-score");
    const progress = document.querySelector(".progress");
    const progressBar = document.querySelector("#progress-bar");
    const questionHeading = document.querySelector("#question");
    const answersContainer = document.querySelector("#answers");
    const feedback = document.querySelector("#feedback");
    const nextButton = document.querySelector("#next-button");
    const finalScore = document.querySelector("#final-score");
    let questionIndex = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      const currentQuestion = questions[questionIndex];
      questionCount.textContent = `Pergunta ${questionIndex + 1} de ${questions.length}`;
      currentScore.textContent = `${score} ${score === 1 ? "ponto" : "pontos"}`;
      progressBar.style.width = `${questionIndex / questions.length * 100}%`;
      progress.setAttribute("aria-valuenow", String(questionIndex));
      questionHeading.textContent = currentQuestion.question;
      feedback.textContent = "";
      answered = false;
      nextButton.disabled = true;
      nextButton.textContent = questionIndex === questions.length - 1 ? "Ver resultado" : "Próxima";
      answersContainer.replaceChildren();

      currentQuestion.answers.forEach((answer, answerIndex) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";

        const letter = document.createElement("span");
        letter.className = "letter";
        letter.setAttribute("aria-hidden", "true");
        letter.textContent = String.fromCharCode(65 + answerIndex);

        const answerText = document.createElement("span");
        answerText.textContent = answer;
        button.append(letter, answerText);
        button.addEventListener("click", () => chooseAnswer(answerIndex));
        answersContainer.append(button);
      });
    }

    function chooseAnswer(selectedIndex) {
      if (answered) return;
      answered = true;
      const correctIndex = questions[questionIndex].correct;
      const answerButtons = answersContainer.querySelectorAll(".answer");
      answerButtons.forEach((button, index) => {
        button.disabled = true;
        if (index === correctIndex) button.classList.add("correct");
        if (index === selectedIndex && index !== correctIndex) button.classList.add("incorrect");
      });

      if (selectedIndex === correctIndex) {
        score += 1;
        feedback.textContent = "Boa! Essa resposta está correta.";
      } else {
        feedback.textContent = `Não foi dessa vez. A resposta certa é ${questions[questionIndex].answers[correctIndex]}.`;
      }
      const completedQuestions = questionIndex + 1;
      progressBar.style.width = `${completedQuestions / questions.length * 100}%`;
      progress.setAttribute("aria-valuenow", String(completedQuestions));
      currentScore.textContent = `${score} ${score === 1 ? "ponto" : "pontos"}`;
      nextButton.disabled = false;
    }

    function showResults() {
      quiz.hidden = true;
      finalScreen.hidden = false;
      const total = questions.length;
      const percentage = Math.round(score / total * 100);
      finalScore.replaceChildren(
        document.createTextNode("Você acertou "),
        Object.assign(document.createElement("strong"), { textContent: `${score} de ${total}` }),
        document.createTextNode(` perguntas (${percentage}%).`)
      );
    }

    nextButton.addEventListener("click", () => {
      if (!answered) return;
      if (questionIndex === questions.length - 1) {
        showResults();
        return;
      }
      questionIndex += 1;
      renderQuestion();
    });

    document.querySelector("#restart-button").addEventListener("click", () => {
      questionIndex = 0;
      score = 0;
      finalScreen.hidden = true;
      quiz.hidden = false;
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
